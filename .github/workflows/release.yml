name: Release desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v, for example 0.2.0'
        required: true
        type: string
      release_name:
        description: 'GitHub Release title'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark this release as a prerelease'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Create the GitHub Release as a draft for final review'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18.19.0
          cache: npm

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Set package version for this build
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        # --publish never: packaging must never create/update a release by itself;
        # uploading happens once, in the dedicated 'publish' job below.
        run: npm run build:${{ matrix.platform }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: euclid-${{ matrix.platform }}-${{ inputs.version }}
          path: apps/desktop/release/${{ inputs.version }}/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.release_name || format('Euclid v{0}', inputs.version) }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
